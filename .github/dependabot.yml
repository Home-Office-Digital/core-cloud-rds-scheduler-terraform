version: 2
updates:
    # Enable Github Action updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(GHA)"
      reviewers:
          - "Home-Office-Digital/core-cloud-ai-ops"
      labels: []

    # Enable GoMod updates for GoLang Projects
    - package-ecosystem: "gomod"
      directory: "/tests/terratest"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(Go)"
      reviewers:
          - "Home-Office-Digital/core-cloud-ai-ops"
      labels: []


    # Enable TF updates for Terraform Projects
    - package-ecosystem: "terraform"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(TF)"
      reviewers:
          - "Home-Office-Digital/core-cloud-ai-ops"
      labels: []
